# Dev-only config for the SSR rearchitecture worker (docs/plan-ssr-
# rearchitecture.md). Deliberately SEPARATE from wrangler.toml: the
# production Worker (worker/index.js) keeps deploying exactly as before via
# `git push origin main` -- this file is never touched by that pipeline.
#
# No `routes`/`custom_domain` here on purpose. Cutover (Phase 8) means
# copying the relevant route into wrangler.toml once this worker is proven,
# not switching this file live. Until then: `npm run ssr:dev` only.
#
# Same D1 database as production (`redflare-db`) -- this worker only adds
# new tables (migrations/0005_ssr_schema.sql), it does not touch
# stale/idx/recs/mirrored/mirror_queue/popularity/cache_stats.

name = "redflare-ssr"
main = "src-ssr/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "redflare-db"
database_id = "6eaf211c-0fcb-4404-9cff-718048e7c0c7"

# SELF: service binding used by the sync orchestrator to fan out
# /__sync/batch/:n and /__sync/backfill-shard/:n shards, same pattern as
# worker/lib/home.js's runHomeRefresh on the production worker (a plain
# fetch() to this Worker's own Custom Domain 522s; a service binding routes
# directly to the fetch handler without touching the public network).
[[services]]
binding = "SELF"
service = "redflare-ssr"

# Same cadence as production's incremental sync (worker/index.js
# `*/30 * * * *`). Free plan allows 5 cron triggers per account total --
# production already uses 3 (hourly, */10, */30); this worker adds 1 while
# it runs side-by-side in dev. Backfill is triggered on demand
# (/__sync/backfill), never on a cron, so it never overlaps a schedule.
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
