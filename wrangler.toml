name = "redflare"
compatibility_date = "2024-03-20"
workers_dev = false
preview_urls = false

# Pin the custom domain in config so each deploy re-attaches it — avoids the site
# going down when the Git integration is disconnected/reconnected.
routes = [
  { pattern = "phim.bluesia.net", custom_domain = true },
]

# worker/index.js fronts /api/* with a KV cache-aside in front of the VPS
# catalog-api (img.bluesia.net) — see state.md Phase 3. Everything that isn't
# /api/* and isn't a literal file in dist/ falls through to the assets layer,
# which applies not_found_handling below (SPA fallback for client routes).
main = "worker/index.js"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# TODO(Phase 3 cutover): replace with the real namespace id before this is
# pushed to main — Cloudflare Workers Builds runs `wrangler deploy`, which
# fails if this id doesn't exist in the account. `wrangler dev` (local) works
# fine with a placeholder since local KV is simulated regardless of the id.
[[kv_namespaces]]
binding = "CATALOG_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"
