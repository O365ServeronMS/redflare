name = "redflare"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

# Pin the custom domain in config so each deploy re-attaches it — avoids the site
# going down when the Git integration is disconnected/reconnected.
routes = [
  { pattern = "phim.bluesia.net", custom_domain = true },
]

# worker/index.js fronts /api/* with a caching layer in front of the VPS
# catalog-api (img.bluesia.net) — see bluesiaOM/context/state-redflare-cf-worker.md
# for the full migration state. Everything that isn't /api/* and isn't a literal
# file in dist/ falls through to the assets layer, which applies
# not_found_handling below (SPA fallback for client routes).
main = "worker/index.js"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# CATALOG_KV: durable last-known-good copy of /api/home-data only (single key).
# Hot-tier caching for every /api/* path is the Cache API (caches.default),
# not KV — keeps per-day KV writes bounded regardless of query cardinality
# (e.g. /api/search keywords). See worker/index.js.
[[kv_namespaces]]
binding = "CATALOG_KV"
id = "a4a69489a7da49d3895c9ed2389b7055"

# DB: durable last-known-good copy for list/genre/country/movie/recommendation
# (table `stale`, migrations/0001_stale.sql), plus the reverse index /
# recommendation cache / R2-mirroring bookkeeping tables added for later
# phases (migrations/0002_recs_idx_mirror.sql — idx, recs, mirrored,
# mirror_queue are not read/written by the Worker yet, that's Phase 5/6).
[[d1_databases]]
binding = "DB"
database_name = "redflare-db"
database_id = "6eaf211c-0fcb-4404-9cff-718048e7c0c7"

# BUCKET: R2 bucket that already mirrors artwork for redflarer2.bluesia.net
# (mirrored there by the VPS catalog-api today; the Worker doesn't write to
# it yet — that's Phase 6, when mirroring moves off the VPS). Binding name
# deliberately differs from the "Redflare-R2" name briefly added via the
# dashboard on 2026-07-31 (and silently dropped by the next git-push deploy,
# since dashboard-only bindings aren't in this file) — binding name only
# affects code, not the bucket itself.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "redflare-r2"

# LEGACY_UPSTREAM=1 is the emergency rollback switch: forces every /api/*
# path back through the VPS proxy (img.bluesia.net), bypassing the Worker's
# own OPhim+TMDB builders (worker/index.js localBuilder / worker/lib/*) AND
# the Phase 4 home-data cron/KV path entirely -- one flag for "go back to
# full VPS dependency". Flip via `wrangler deploy --var LEGACY_UPSTREAM:1`
# or the dashboard, no code revert or redeploy needed. Default "0".
# recommendation/related always proxy regardless of this flag -- that's
# unconditional until Phase 5.
[vars]
LEGACY_UPSTREAM = "0"

# Two cron schedules, dispatched by event.cron in scheduled():
#   "0 * * * *"    hourly — home-data refresh (worker/lib/home.js
#                  runHomeRefresh) + idx/recs sweep (cleanupRecTables).
#                  60-min cadence confirmed acceptable by the VPS owner
#                  2026-08-01; keeps KV writes well under 1,000/day.
#   "*/10 * * * *" every 10 min — drain the R2 image-mirror queue
#                  (worker/lib/mirror.js drainMirrorQueue), <=20 images/run.
# Both can also be triggered on demand (header x-cron-key: <CRON_KEY>):
#   GET /__cron/refresh-home  and  GET /__cron/mirror.
[triggers]
crons = ["0 * * * *", "*/10 * * * *"]

# SELF: service binding to this same Worker, used by runHomeRefresh
# (worker/lib/home.js) to call the /__cron/shard/:n routes. A plain fetch()
# to https://phim.bluesia.net/... from WITHIN this Worker returns a
# documented Cloudflare 522 -- "performing a fetch to its own hostname"
# on a Custom Domain always fails that way (confirmed reproducing it
# 2026-08-01). A service binding routes directly to this Worker's own fetch
# handler without touching the public network at all, sidestepping the
# issue entirely.
[[services]]
binding = "SELF"
service = "redflare"

# Ships Worker logs to the dashboard (Workers Logs). Must be the LAST section
# in this file — TOML has no block-end marker, so any top-level key=value
# written after a [table] header (even routes/main above) gets silently
# absorbed into that table instead of staying top-level. Learned this the
# hard way: an earlier edit placed [observability] before `routes`/`main`
# and wrangler warned "Unexpected fields found in observability field:
# routes, main" — both had been swallowed.
[observability]
enabled = true
