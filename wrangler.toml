name = "redflare"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

# nodejs_compat: the SSR rearchitecture (docs/plan-ssr-rearchitecture.md,
# docs/adr/0002-no-vps-ssr-architecture.md) replaces the SPA + JSON-API
# worker (worker/index.js, removed) with a server-rendering Hono app
# (src-ssr/index.ts). global_fetch_strictly_public is gone with it -- that
# flag only existed for the old edge-warming cron (worker/lib/warm.js
# runEdgeWarm), which has no equivalent here.
compatibility_flags = ["nodejs_compat"]

# Pin the custom domain in config so each deploy re-attaches it — avoids the site
# going down when the Git integration is disconnected/reconnected.
routes = [
  { pattern = "phim.bluesia.net", custom_domain = true },
]

# src-ssr/index.ts: reads D1 directly and renders HTML server-side, no
# runtime calls to KKPhim/TMDB (ADR-0002 Principle 3). Cutover landed
# 2026-08-07 before Phase 3-6 of the plan were built -- see
# docs/state-ssr-rearchitecture.md for what that means is NOT yet served
# (list/genre/country/search pages, recommendations, sitemap, cache/security
# headers, static assets). Only /phim/:slug and /__sync/* are live.
main = "src-ssr/index.ts"

# No [assets] block: the old dist/ (Vite SPA build) is retired along with
# worker/index.js. Keeping [assets] here would let Cloudflare's asset layer
# intercept requests with the OLD dist/index.html (SPA-fallback) BEFORE this
# Worker ever runs, which would silently resurrect dead /api/* calls instead
# of the new SSR routes. Static asset serving returns in a later phase, once
# there's something real to serve.

# DB: same redflare-db as before. Legacy tables from the SPA-era worker
# (stale, idx, recs, mirrored, mirror_queue, popularity, cache_stats) were
# dropped by migrations/0006_drop_legacy_tables.sql at cutover; the SSR
# schema (movie, episode, recommendation, genre, country, genre_movie,
# country_movie, sync_state) is migrations/0005_ssr_schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "redflare-db"
database_id = "6eaf211c-0fcb-4404-9cff-718048e7c0c7"

# BUCKET: R2 bucket that used to serve mirrored artwork at img.bluesia.net.
# Out of scope for this cutover (only worker/KV/D1 were touched) -- the SSR
# code does not read or write it. Left bound rather than removed so a
# decision about img.bluesia.net (DNS, existing cached URLs) isn't made as a
# side effect of this change; revisit explicitly per ADR-0002 Finding 8.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "redflare-r2"

# Single cron: incremental sync (plan §2.1), matches src-ssr's scheduled()
# handler. The old worker's hourly home-refresh and */10 mirror-drain crons
# have no equivalent in the new architecture (no KV home cache, no R2
# mirroring) and are gone with worker/lib/home.js and worker/lib/mirror.js.
[triggers]
crons = ["*/30 * * * *"]

# SELF: service binding used by services/sync/orchestrator.ts to fan out
# /__sync/batch/:n shards without a same-zone fetch() 522ing (same reasoning
# as the retired worker/lib/home.js SELF usage). Points at this same worker
# ("redflare") since the SSR code now runs directly on this Worker script,
# not a separate one.
[[services]]
binding = "SELF"
service = "redflare"

[observability]
enabled = true
