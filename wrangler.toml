name = "redflare"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

# nodejs_compat supports the Hono/TypeScript Worker runtime. The old
# global_fetch_strictly_public flag belonged to the retired edge-warming
# architecture and has no equivalent in the current D1-backed Worker.
compatibility_flags = ["nodejs_compat"]

# Pin the custom domain in config so each deploy re-attaches it — avoids the site
# going down when the Git integration is disconnected/reconnected.
routes = [
  { pattern = "phim.bluesia.net", custom_domain = true },
]

# src-ssr/index.ts now owns only JSON APIs, sitemap/robots, sync routes and
# the scheduled handler. The premium Vite SPA in dist/ owns every browser
# page; selective assets.run_worker_first below keeps dynamic routes out of
# the SPA fallback.
main = "src-ssr/index.ts"

# Workers Caching (Phase 5, closes ADR-0001 Action Item 7 / ADR-0002 Finding
# 4) -- chosen over the Cache API this project used to run: a HIT never
# invokes the Worker at all (no CPU billed, no D1 touched), and concurrent
# misses for the same URL collapse into one Worker invocation instead of one
# each -- the latter matters because D1 is single-threaded (Cloudflare docs:
# "processes queries one at a time"), so a cold-cache burst on a popular
# title used to mean N simultaneous D1 hits. src-ssr/cache/control.ts sets
# Cache-Control/Cache-Tag per response; src-ssr/services/sync/syncMovie.ts
# purges by tag when a title's data actually changes.
[cache]
enabled = true

# Static Assets serves the Vite build and rewrites clean browser routes to
# index.html. The explicit Worker-first list is mandatory: dynamic routes
# must not be swallowed by the SPA fallback. Browser document routes also
# pass through the Worker so it can return no-transform and prevent
# Cloudflare-injected scripts from violating the strict CSP; fingerprinted
# files are not listed and still bypass the Worker.
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/__sync/*",
  "/sitemap.xml",
  "/sitemap-*",
  "/robots.txt",
  "/",
  "/phim/*",
  "/danh-sach/*",
  "/the-loai/*",
  "/quoc-gia/*",
  "/tim-kiem",
  "/tim-kiem/",
]

# DB: recreated 2026-08-07 -- the original redflare-db (and the R2 bucket
# below) were deleted directly by the account owner as part of the same
# cleanup this cutover started, ahead of any code change on this side. New
# database, new id, empty: migrations/0001-0004 (legacy schema) replay and
# get dropped again by 0006, migrations/0005_ssr_schema.sql creates the
# schema src-ssr/ actually uses. All prior synced data (the one test movie
# from Phase 1/2 verification) is gone -- expected, nothing was backfilled
# yet.
[[d1_databases]]
binding = "DB"
database_name = "redflare-db"
database_id = "40c364b3-10a8-4d03-bd51-60debe94610a"

# R2 removed 2026-08-07 (account owner deleted the redflare-r2 bucket
# directly) -- no [[r2_buckets]] binding here anymore. src-ssr/ never read
# or wrote R2 to begin with (ADR-0002: images are hotlinked from
# TMDB/phimimg, never mirrored), so this has no code-side effect. Any
# lingering img.bluesia.net DNS/custom-domain attachment to the deleted
# bucket is outside wrangler.toml's scope -- check the R2 dashboard if that
# hostname needs cleaning up too.

# BACKFILL_MODE: "free" applies the D1 daily-write governor; "burst" is the
# explicit Workers Paid mode and bypasses that governor. Burst remains bound
# by the project's aggregate upstream limit (KKPhim 25 RPS, TMDB 40 RPS),
# Cron wall time, and D1's Paid-plan 10GB per-database platform limit.
# F2 pilot: materialize only highly shared TMDB targets, bounded at 1,000
# total stub rows while cron health and D1 growth are observed.
[vars]
BACKFILL_MODE = "burst"
MAX_STUBS = "1000"

# Single cron: drives BOTH incremental sync (plan §2.1) and, since
# 2026-08-07, the Phase 7 backfill walk (services/sync/orchestrator.ts
# runBackfillTick -- resumes from a D1 cursor each tick, no external
# trigger needed, matches ADR-0002's "cron is the only thing allowed to
# call TMDB/phimimg" principle). The old worker's hourly home-refresh and
# */10 mirror-drain crons have no equivalent in the new architecture (no KV
# home cache, no R2 mirroring) and are gone with worker/lib/home.js and
# worker/lib/mirror.js.
[triggers]
crons = ["*/15 * * * *"]

# SELF: service binding used by services/sync/orchestrator.ts to fan out
# /__sync/batch/:n shards without a same-zone fetch() 522ing (same reasoning
# as the retired worker/lib/home.js SELF usage). Points at this same worker
# ("redflare") because the backend runs directly on this Worker script.
[[services]]
binding = "SELF"
service = "redflare"

[observability]
enabled = true
