name = "redflare"
compatibility_date = "2026-08-01"
workers_dev = false
preview_urls = false

# nodejs_compat supports the Hono/TypeScript Worker runtime. The old
# global_fetch_strictly_public flag belonged to the retired edge-warming
# architecture and has no equivalent in the current D1-backed Worker.
compatibility_flags = ["nodejs_compat"]

# Pin the custom domain in config so each deploy re-attaches it — avoids the site
# going down when the Git integration is disconnected/reconnected.
routes = [
  { pattern = "phim.bluesia.net", custom_domain = true },
]

# src-ssr/index.ts now owns only JSON APIs, sitemap/robots, sync routes and
# the scheduled handler. The premium Vite SPA in dist/ owns every browser
# page; selective assets.run_worker_first below keeps dynamic routes out of
# the SPA fallback.
main = "src-ssr/index.ts"

# Workers Caching (Phase 5, closes ADR-0001 Action Item 7 / ADR-0002 Finding
# 4) -- chosen over the Cache API this project used to run: a HIT never
# invokes the Worker at all (no CPU billed, no D1 touched), and concurrent
# misses for the same URL collapse into one Worker invocation instead of one
# each -- the latter matters because D1 is single-threaded (Cloudflare docs:
# "processes queries one at a time"), so a cold-cache burst on a popular
# title used to mean N simultaneous D1 hits. src-ssr/cache/control.ts sets
# Cache-Control/Cache-Tag per response; src-ssr/services/sync/syncMovie.ts
# purges by tag when a title's data actually changes.
#
# NOTE, easy to get wrong: this is the WORKER's cache, not the zone's. "No
# zone-level purge (via the dashboard, API, or Terraform) affects Workers
# Caching content" (Cloudflare docs, /workers/cache/purge/). Caching ->
# Purge Everything on the bluesia.net zone does NOT clear /api/* anymore --
# that procedure was correct only while this project used caches.default
# (the Cache API, which IS the zone cache) and stopped being correct at the
# Phase 5 migration. The only ways to invalidate now are from inside the
# Worker: GET /__sync/purge-cache (purge everything, see routes/sync.ts),
# the per-title tag purges in the sync pipeline, or a deploy (below).
#
# cross_version_cache deliberately LEFT AT ITS DEFAULT (false): the Worker
# version stays part of the cache key, so each deploy starts from a clean
# cache. That makes `git push origin main` an automatic full invalidation --
# the simplest, most reliable purge available here, costing nothing and
# subject to no purge rate limit. Setting it to true was evaluated and
# rejected: it buys a warmer cache across deploys, but the D1 read it saves
# is one indexed 24-row page per distinct path, which is noise against the
# Free plan's 5M rows/day -- not worth giving up deploy-time invalidation.
[cache]
enabled = true

# Static Assets serves the Vite build and rewrites clean browser routes to
# index.html. The explicit Worker-first list is mandatory: dynamic routes
# must not be swallowed by the SPA fallback. Browser document routes also
# pass through the Worker so it can return no-transform and prevent
# Cloudflare-injected scripts from violating the strict CSP; fingerprinted
# files are not listed and still bypass the Worker.
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/__sync/*",
  "/sitemap.xml",
  "/sitemap-*",
  "/robots.txt",
  "/",
  "/phim/*",
  "/danh-sach/*",
  "/the-loai/*",
  "/quoc-gia/*",
  "/tim-kiem",
  "/tim-kiem/",
]

# DB: recreated 2026-08-07 -- the original redflare-db (and the R2 bucket
# below) were deleted directly by the account owner as part of the same
# cleanup this cutover started, ahead of any code change on this side. New
# database, new id, empty: migrations/0001-0004 (legacy schema) replay and
# get dropped again by 0006, migrations/0005_ssr_schema.sql creates the
# schema src-ssr/ actually uses. All prior synced data (the one test movie
# from Phase 1/2 verification) is gone -- expected, nothing was backfilled
# yet.
[[d1_databases]]
binding = "DB"
database_name = "redflare-db"
database_id = "40c364b3-10a8-4d03-bd51-60debe94610a"

# R2 removed 2026-08-07 (account owner deleted the redflare-r2 bucket
# directly) -- no [[r2_buckets]] binding here anymore. src-ssr/ never read
# or wrote R2 to begin with (ADR-0002: images are hotlinked from
# TMDB/phimimg, never mirrored), so this has no code-side effect. Any
# lingering img.bluesia.net DNS/custom-domain attachment to the deleted
# bucket is outside wrangler.toml's scope -- check the R2 dashboard if that
# hostname needs cleaning up too.

# BACKFILL_MODE: "free" applies the D1 daily-write governor; "burst" is the
# explicit Workers Paid mode and bypasses that governor. Reverted to "free"
# here per docs/plan-free-plan-migration.md Phase 6 -- the initial catalog
# backfill is complete (backfill.done, docs/state-free-plan-migration.md
# Phase 0) and BACKFILL_ENABLED is "false" below, so nothing currently
# writes fast enough to need burst's bypass; steady-state D1 writes are the
# few-hundred-to-few-thousand-rows/day the governor is sized for
# (MAX_ROWS_PER_DAY = 85_000 in orchestrator.ts). Flip back to "burst" only
# for a future large, time-boxed re-crawl, and only while actually on
# Workers Paid -- burst has no governor at all, so it is not Free-plan-safe
# on its own. Verify via /__sync/status rowsWrittenToday for a few days
# after any BACKFILL_ENABLED re-crawl before treating this as settled
# (plan Phase 7); actually downgrading the Cloudflare subscription itself
# (plan Phase 8) is a real-account action gated on explicit sign-off from
# the project owner, not something either mode here decides.
#
# BACKFILL_ENABLED/BACKFILL_TYPE/BACKFILL_PAGE_FROM/BACKFILL_PAGE_TO
# (docs/plan-free-plan-migration.md Phase 3): all four are plain [vars], so
# they're editable by hand from the Cloudflare dashboard ("Variables and
# secrets") without a redeploy. Left at their inert defaults here -- the
# initial catalog backfill is already complete
# (docs/state-free-plan-migration.md Phase 0); flip BACKFILL_ENABLED to
# "true" (optionally scoped with the other three) on the dashboard for a
# future targeted re-crawl. See services/sync/orchestrator.ts
# runBackfillTick for exact semantics.
[vars]
BACKFILL_MODE = "free"
MAX_STUBS = "1000"
BACKFILL_ENABLED = "false"
BACKFILL_TYPE = ""
BACKFILL_PAGE_FROM = ""
BACKFILL_PAGE_TO = ""
# Siteverify must match the hostname of the frontend that produced the token.
# Localhost belongs only in a local override, never in this production value.
TURNSTILE_HOSTNAMES = "phim.bluesia.net"

# The legacy single [triggers] cron (drove the old scheduled() handler in
# src-ssr/index.ts) is retired as of docs/plan-free-plan-migration.md Phase
# 5 -- docs/state-free-plan-migration.md Phase 0 measured that shape (five
# jobs, one shared invocation, no per-job budget reset) exceeding the
# Free-plan 50-external-subrequest cap on two of the jobs individually, and
# Phase 5 itself was triggered by live production evidence: at a
# dashboard-configured 10ms CPU limit, recommendation resolve was
# consistently the job running when the isolate got killed for exceeding
# CPU. The Cloudflare Workflows below (docs/plan-free-plan-migration.md
# Phase 3) fully replace it -- one per job, each step getting its own fresh
# CPU/subrequest budget. Each Workflow's `schedules` is its own cron budget
# (up to 100 cron expressions/account, separate from the classic Cron
# Trigger quota that used to gate the single shared trigger) -- this is what
# lets incremental sync run every 30 min while the other three keep their
# original 15-min cadence, which a single shared Cron Trigger could not do.
[[workflows]]
name = "incremental-sync"
binding = "INCREMENTAL_SYNC_WORKFLOW"
class_name = "IncrementalSyncWorkflow"
schedules = ["*/30 * * * *"]

# Hourly, not */15: HERO_REFRESH_INTERVAL_SECONDS's 30-min gate meant a
# */15 cron alternated real-run/skip ticks (~23 steps + ~1 step each),
# ~1,152 steps/day. Hourly always lands past the gate, so every tick is a
# real run (~23 steps) with none wasted on a skip check -- ~552 steps/day,
# same effective freshness. See docs/state-free-plan-migration.md Phase 6
# (Workflows steps quota, not CPU, is the binding Free-plan constraint here).
[[workflows]]
name = "hero-snapshot"
binding = "HERO_SNAPSHOT_WORKFLOW"
class_name = "HeroSnapshotWorkflow"
schedules = ["0 * * * *"]

# */30, not */15: halves run count against the same backlog-chunking cost
# per run, keeping this workflow (the largest single step-count consumer)
# under the Workers Free 3,000-steps/day quota. See
# docs/state-free-plan-migration.md Phase 6.
[[workflows]]
name = "recommendation-resolve"
binding = "RECOMMENDATION_RESOLVE_WORKFLOW"
class_name = "RecommendationResolveWorkflow"
schedules = ["*/30 * * * *"]

# Hourly, not */15: RECOMMENDATION_REFRESH_LIMIT (20 sources/run) doesn't
# need quarter-hourly cadence to keep D1 `recommendation_freshness` rows
# from going stale. See docs/state-free-plan-migration.md Phase 6.
[[workflows]]
name = "recommendation-refresh"
binding = "RECOMMENDATION_REFRESH_WORKFLOW"
class_name = "RecommendationRefreshWorkflow"
schedules = ["0 * * * *"]

# Scheduled but inert by default (BACKFILL_ENABLED = "false" above) -- each
# tick costs one cheap D1 read + early return until an operator flips it on.
[[workflows]]
name = "backfill"
binding = "BACKFILL_WORKFLOW"
class_name = "BackfillWorkflow"
schedules = ["*/15 * * * *"]

# SELF: service binding used by services/sync/orchestrator.ts to fan out
# /__sync/batch/:n shards without a same-zone fetch() 522ing (same reasoning
# as the retired worker/lib/home.js SELF usage). Points at this same worker
# ("redflare") because the backend runs directly on this Worker script.
[[services]]
binding = "SELF"
service = "redflare"

[observability]
enabled = true

# head_sampling_rate = 1 (100%) made explicit rather than left to the
# implicit default -- this Worker's own console.error calls are already
# low-volume (the unhandled-exception boundary in index.ts, plus a handful
# of swallowed-error sites in the sync pipeline; see their own comments), so
# nothing here is high-cardinality enough yet to need downsampling. Revisit
# if per-request logging is ever added to the hot /api/* path.
[observability.logs]
head_sampling_rate = 1
